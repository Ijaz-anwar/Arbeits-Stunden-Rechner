<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4870" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Rounded Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)" />
  <!-- Clock Outer Ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Clock Center Pin -->
  <circle cx="24" cy="24" r="2" fill="#ffffff" />
  <!-- Hour Hand (pointing at ~10) -->
  <line x1="24" y1="24" x2="18" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Minute Hand (pointing at ~2) -->
  <line x1="24" y1="24" x2="31" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <!-- Accent Small Dot at 12 o'clock -->
  <circle cx="24" cy="11.5" r="1.2" fill="#93c5fd" />
</svg>
